<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <header>    
       <h1>Sign In to NIHONGO NOTES</h1>
       <p>Welcome back! Please enter your credentials to access your account.</p>
    </header>
    <div class="signin-form">
        <form action="dashboard.html" method="post">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password" required><br><br>
            <label for="terms">
            I agree to the Terms and Conditions<input type="checkbox" id="terms" name="terms" required><br><br>
            I agree to the Terms of Service & Privacy Policy<input type="checkbox" id="terms" name="terms" required>
            </label><br><br>
            <a href="dashboard.html"><button type="submit">Sign In</button></a>
        </form>
    </div>
    <script>
      document.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
    const email = document.getElementById("email").value;

    if (!username || !password || !email) {
      alert("Fill all fields");
      return;
    }

    const user = {
      username,
      password,
      email
    };

    localStorage.setItem("nihongoUser", JSON.stringify(user));
    localStorage.setItem("isLoggedIn", "true");

    window.location.href = "dashboard.html";
 });
</script>
</body>
</html>
